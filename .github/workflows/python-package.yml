name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: "3.14"
    - name: Lint with ruff
      run: |
        python -m pip install --upgrade pip ruff
        ruff check --output-format=github .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e . --group test
    - name: Test with pytest
      run: pytest --cov --cov-report=xml --cov-report=term-missing
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  # Oldest supported Python with the minimum dependency versions from pyproject.toml.
  minimum-versions:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: "3.11"
    - name: Install minimum dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e . --group test \
          grpcio==1.66.2 grpcio-reflection==1.66.2 grpcio-health-checking==1.66.2 protobuf==5.27.2
    - name: Test with pytest
      run: pytest

  # Build the sdist/wheel and run the tests against the *installed* wheel (outside the
  # source tree) so that packaging mistakes, e.g. missing subpackages, are caught.
  package:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: "3.14"
    - name: Build
      run: |
        python -m pip install --upgrade pip build
        python -m build
    - name: Test the installed wheel
      run: |
        python -m venv "$RUNNER_TEMP/venv"
        "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl --group test
        cp -r tests "$RUNNER_TEMP/"
        cd "$RUNNER_TEMP"
        "$RUNNER_TEMP/venv/bin/python" -I -m pytest tests
    - name: Test the sdist (build from it and run its own tests)
      run: |
        mkdir "$RUNNER_TEMP/sdist"
        tar xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist"
        cd "$RUNNER_TEMP"/sdist/grpc_router-*/
        python -m venv "$RUNNER_TEMP/sdist-venv"
        "$RUNNER_TEMP/sdist-venv/bin/pip" install . --group test
        "$RUNNER_TEMP/sdist-venv/bin/python" -m pytest
